# ==================================================================
# Conecta Alimento API - configuração padrão (Oracle da FIAP)
# As credenciais NUNCA ficam no código: use variáveis de ambiente.
#   DB_URL      (padrão: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL)
#   DB_USER     (ex.: rm562475)
#   DB_PASSWORD (senha do Oracle da FIAP)
# Para rodar sem Oracle, use o perfil h2:  --spring.profiles.active=h2
# ==================================================================
spring.application.name=conecta-alimento-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1

# cria as tabelas se não existirem e carrega dados de demonstração com o banco vazio
app.db.inicializar=${DB_INICIALIZAR:true}
app.db.dados-exemplo=${DB_DADOS_EXEMPLO:true}
app.db.script-schema=classpath:db/schema-oracle.sql

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=always
