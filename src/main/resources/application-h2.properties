# ==================================================================
# Perfil h2: banco em memória (modo Oracle) para rodar/testar sem o Oracle da FIAP.
# Uso: --spring.profiles.active=h2   (os dados somem ao reiniciar)
# ==================================================================
spring.datasource.url=jdbc:h2:mem:conectaalimento;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.db.script-schema=classpath:db/schema-h2.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
